name: OIDC integration test

# Runs test/run.sh against the test tenant with OIDC authentication: GitHub
# issues a token for the job, Entra ID exchanges it for an Exchange Online
# access token. No certificate or secret credential is stored in GitHub.
#
# The job runs in the "test" environment: only main and feat/* branches can use
# it, every run waits for a maintainer's approval, and the app registration
# trusts the subject repo:workplace-as-code/terraform-provider-msexchangeonline:environment:test.
# A pull request from a fork never reaches it.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets the job request its OIDC token

# One run at a time: two runs would fight over the same test objects.
concurrency:
  group: integration
  cancel-in-progress: false

jobs:
  oidc:
    name: Integration tests with OIDC
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # run.sh reads terraform's output: no wrapper around the binary
          terraform_wrapper: false

      - name: Install the ExchangeOnlineManagement module
        shell: pwsh
        run: |
          Install-PSResource -Name ExchangeOnlineManagement -Scope CurrentUser -TrustRepository -Quiet

      - name: Show the tested versions
        shell: pwsh
        run: |
          terraform version
          "PowerShell $($PSVersionTable.PSVersion)"
          Get-Module -ListAvailable ExchangeOnlineManagement | Select-Object Name, Version | Format-Table

      # Exchanges the job's OIDC token outside the provider: when the federated
      # credential is wrong, this step fails with the Entra ID error code
      # instead of the integration suite failing later.
      - name: Check the federated credential
        env:
          EXCHANGE_TENANT_ID: ${{ secrets.EXCHANGE_TENANT_ID }}
          EXCHANGE_CLIENT_ID: ${{ secrets.EXCHANGE_CLIENT_ID }}
        run: |
          assertion=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          echo "::add-mask::$assertion"
          response=$(curl -sS "https://login.microsoftonline.com/$EXCHANGE_TENANT_ID/oauth2/v2.0/token" \
            --data-urlencode grant_type=client_credentials \
            --data-urlencode "client_id=$EXCHANGE_CLIENT_ID" \
            --data-urlencode client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer \
            --data-urlencode "client_assertion=$assertion" \
            --data-urlencode scope=https://outlook.office365.com/.default)
          if [ "$(jq -r 'has("access_token")' <<<"$response")" = "true" ]; then
            echo "OK: Entra ID issued an Exchange Online access token for the job's OIDC token"
          else
            echo "::error::Entra ID refused the job's OIDC token"
            jq '{error, error_codes, error_description}' <<<"$response"
            exit 1
          fi

      - name: Run the integration suite
        env:
          EXCHANGE_AUTH_METHOD: oidc_github
          EXCHANGE_TENANT_ID: ${{ secrets.EXCHANGE_TENANT_ID }}
          EXCHANGE_CLIENT_ID: ${{ secrets.EXCHANGE_CLIENT_ID }}
          TF_VAR_primary_domain: ${{ secrets.TF_VAR_PRIMARY_DOMAIN }}
          TF_VAR_test_mailbox: ${{ secrets.TF_VAR_TEST_MAILBOX }}
          TF_VAR_test_mail_enabled_group: ${{ secrets.TF_VAR_TEST_MAIL_ENABLED_GROUP }}
          TF_VAR_test_app_id: ${{ vars.TF_VAR_TEST_APP_ID }}
          TF_VAR_test_dkim_domain: ${{ secrets.TF_VAR_TEST_DKIM_DOMAIN }}
          TF_VAR_test_dkim_enabled: ${{ vars.TF_VAR_TEST_DKIM_ENABLED || 'false' }}
          # run.sh tests Defender as soon as the variable is not empty:
          # only "1" turns it on, so "0" really turns it off.
          EXCHANGE_TEST_DEFENDER: ${{ vars.EXCHANGE_TEST_DEFENDER == '1' && '1' || '' }}
        run: ./test/run.sh
